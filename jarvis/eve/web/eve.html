<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>Eve</title>
<style>
  :root { --bg:#0a0e1a; --panel:rgba(255,255,255,0.06); --accent:#ff6fae; --accent2:#8b5cf6;
          --text:#eaf0ff; --muted:#8aa0c8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; color:var(--text);
         background:radial-gradient(800px 500px at 80% -10%, #2a1430 0%, var(--bg) 55%); height:100vh;
         display:flex; flex-direction:column; }
  header { padding:16px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .av { width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffc6e2, var(--accent) 60%, #a01f5e 100%);
        box-shadow:0 0 16px rgba(255,111,174,0.6); }
  h1 { font-size:17px; margin:0; letter-spacing:1px; }
  .sub { font-size:11px; color:var(--muted); }
  #tasks { padding:8px 14px; display:flex; flex-direction:column; gap:8px; }
  .task { background:var(--panel); border:1px solid rgba(139,92,246,0.3); border-radius:12px; padding:10px 12px; font-size:13px;
          display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .task button { background:transparent; border:1px solid rgba(255,255,255,0.25); color:var(--text); border-radius:8px; padding:5px 10px; font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 13px; border-radius:16px; font-size:14px; line-height:1.4; }
  .me { align-self:flex-end; background:linear-gradient(135deg, var(--accent2), #5b21b6); border-bottom-right-radius:4px; }
  .eve { align-self:flex-start; background:var(--panel); border:1px solid rgba(255,111,174,0.3); border-bottom-left-radius:4px; }
  footer { padding:12px 14px; display:flex; gap:10px; border-top:1px solid rgba(255,255,255,0.08); }
  input { flex:1; background:var(--panel); border:1px solid rgba(255,255,255,0.12); border-radius:22px; padding:12px 16px; color:var(--text); font-size:15px; outline:none; }
  .send { background:var(--accent); border:none; color:#2a0a1b; border-radius:50%; width:46px; height:46px; font-size:20px; }
  #gate { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; }
  #gate input { max-width:320px; }
  #gate button { background:var(--accent); border:none; color:#2a0a1b; padding:12px 22px; border-radius:12px; font-size:15px; }
</style>
</head>
<body>
  <div id="gate">
    <div class="av"></div>
    <h1>Pair with Eve</h1>
    <div class="sub">Enter the pairing token shown in the Jarvis log.</div>
    <input id="tok" placeholder="pairing token" />
    <button onclick="pair()">Connect</button>
  </div>

  <header>
    <div class="av"></div>
    <div><h1>Eve</h1><div class="sub" id="status">connected</div></div>
  </header>
  <div id="tasks"></div>
  <div id="log"></div>
  <footer>
    <input id="input" placeholder="Message Eve…" onkeydown="if(event.key==='Enter')send()" />
    <button class="send" onclick="send()">➤</button>
  </footer>

<script>
  let TOKEN = localStorage.getItem("eve_token") || "";
  const $ = (id)=>document.getElementById(id);
  const api = (p)=> p + (p.includes("?")?"&":"?") + "token=" + encodeURIComponent(TOKEN);

  function hdr(){ return {"Content-Type":"application/json","X-Eve-Token":TOKEN}; }

  async function pair(){
    TOKEN = $("tok").value.trim();
    const r = await fetch(api("/eve/pending")).catch(()=>null);
    if (r && r.ok){ localStorage.setItem("eve_token", TOKEN); boot(); }
    else alert("That token didn't work.");
  }

  function addMsg(text, who){
    const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text;
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  }

  async function send(){
    const t = $("input").value.trim(); if(!t) return;
    $("input").value = ""; addMsg(t, "me");
    try{
      const r = await fetch("/eve/chat", {method:"POST", headers:hdr(), body:JSON.stringify({text:t})});
      const d = await r.json(); addMsg(d.reply || "…", "eve");
      loadTasks();
    }catch(e){ addMsg("Can't reach Eve right now.", "eve"); }
  }

  async function loadTasks(){
    try{
      const r = await fetch(api("/eve/pending")); const d = await r.json();
      const box = $("tasks"); box.innerHTML = "";
      (d.pending||[]).forEach(it=>{
        const el = document.createElement("div"); el.className="task";
        el.innerHTML = `<span>🔔 ${it.payload.text||it.type}</span><button>Done</button>`;
        el.querySelector("button").onclick = async ()=>{
          await fetch("/eve/ack",{method:"POST",headers:hdr(),body:JSON.stringify({id:it.id})}); loadTasks();
        };
        box.appendChild(el);
      });
    }catch(e){}
  }

  function boot(){
    $("gate").style.display = "none";
    addMsg("Hi! I'm Eve. I'm synced with Jarvis — anything you tell me will be waiting for you back at your PC.", "eve");
    loadTasks(); setInterval(loadTasks, 8000);
  }

  if (TOKEN) {
    fetch(api("/eve/pending")).then(r=> r.ok ? boot() : null).catch(()=>{});
  }
</script>
</body>
</html>
