<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarvis Orb</title>
<style>
  :root {
    --c-idle-1:#2bd4ff; --c-idle-2:#1e6bff;
    --c-listen-1:#43ffce; --c-listen-2:#00c6a7;
    --c-think-1:#c59bff; --c-think-2:#7b3cff;
    --c-speak-1:#7fe3ff; --c-speak-2:#1e90ff;
  }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    background:#0a0e1a; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
    font-family:"Segoe UI", system-ui, sans-serif;
  }
  .scene { position:relative; width:240px; height:240px; display:flex; align-items:center; justify-content:center; }

  .orb-wrap {
    position:relative; width:120px; height:120px;
    display:flex; align-items:center; justify-content:center;
    transition:transform .5s cubic-bezier(.22,1,.36,1), filter .4s ease;
    animation:breathe 5s ease-in-out infinite;
  }

  /* Soft outer glow halo */
  .halo {
    position:absolute; inset:-55px; border-radius:50%;
    background:radial-gradient(circle, var(--g1) 0%, transparent 62%);
    opacity:.55; filter:blur(10px); transition:opacity .4s ease, background .5s ease;
  }

  /* Rotating aurora rings */
  .ring { position:absolute; border-radius:50%; inset:-10px;
    background:conic-gradient(from 0deg, transparent, var(--g1), transparent, var(--g2), transparent);
    filter:blur(6px); opacity:.65; mix-blend-mode:screen; }
  .ring1 { animation:spin 7s linear infinite; }
  .ring2 { inset:-22px; opacity:.4; animation:spin 11s linear infinite reverse; }

  /* The glassy core sphere */
  .core {
    position:relative; width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle at 36% 30%, rgba(255,255,255,.18) 0%, transparent 35%),
               radial-gradient(circle at 50% 50%, var(--g1) 0%, var(--g2) 58%, #06112e 100%);
    box-shadow:0 0 34px 8px var(--glow), inset 0 0 26px rgba(255,255,255,.28),
               inset 0 -14px 24px rgba(0,0,0,.45);
    transition:box-shadow .4s ease, background .5s ease;
  }
  .sheen {
    position:absolute; top:14%; left:22%; width:46%; height:34%; border-radius:50%;
    background:radial-gradient(circle at 40% 40%, rgba(255,255,255,.75), transparent 70%);
    filter:blur(2px); opacity:.8;
  }

  /* Emanating ripples (speaking / listening) */
  .pulse { position:absolute; width:120px; height:120px; border-radius:50%;
    border:2px solid var(--g1); opacity:0; }

  .caption {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    max-width:210px; text-align:center; font-size:11px; letter-spacing:.3px;
    color:#dbeeff; text-shadow:0 1px 6px #000, 0 0 10px var(--glow);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.92;
  }

  /* ── State palettes (set CSS vars) ───────────────────────────── */
  body.idle      { --g1:var(--c-idle-1);   --g2:var(--c-idle-2);   --glow:rgba(43,150,255,.55); }
  body.listening { --g1:var(--c-listen-1); --g2:var(--c-listen-2); --glow:rgba(0,230,180,.75); }
  body.thinking  { --g1:var(--c-think-1);  --g2:var(--c-think-2);  --glow:rgba(139,92,246,.75); }
  body.speaking  { --g1:var(--c-speak-1);  --g2:var(--c-speak-2);  --glow:rgba(30,144,255,.8); }

  /* ── State behaviours ────────────────────────────────────────── */
  body.idle      .orb-wrap { transform:scale(.92); filter:saturate(.85) brightness(.92); }
  body.idle      .ring     { animation-duration:16s, 22s; opacity:.3; }

  body.listening .orb-wrap { transform:scale(1.02); }
  body.listening .pulse    { animation:ripple 1.5s ease-out infinite; }

  body.thinking  .ring1    { animation-duration:1.8s; opacity:.85; }
  body.thinking  .ring2    { animation-duration:3s; opacity:.6; }

  body.speaking  .orb-wrap { animation:speakPulse .5s ease-in-out infinite; }
  body.speaking  .pulse    { animation:ripple .9s ease-out infinite; }
  body.speaking  .pulse2   { animation-delay:.45s; }

  @keyframes breathe   { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
  @keyframes speakPulse{ 0%,100% { transform:scale(1.0); } 50% { transform:scale(1.12); } }
  @keyframes spin      { to { transform:rotate(360deg); } }
  @keyframes ripple    { 0% { transform:scale(1); opacity:.7; } 100% { transform:scale(1.85); opacity:0; } }
</style>
</head>
<body class="idle">
  <div class="scene">
    <div class="orb-wrap">
      <div class="halo"></div>
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="pulse"></div>
      <div class="pulse pulse2"></div>
      <div class="core"><div class="sheen"></div></div>
    </div>
    <div class="caption" id="caption"></div>
  </div>
<script>
  const STATES = ["idle", "listening", "thinking", "speaking"];
  // Allow ?state=speaking for offline visual previews.
  const forced = new URLSearchParams(location.search).get("state");
  if (forced && STATES.includes(forced)) document.body.className = forced;

  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      const s = await r.json();
      document.body.className = STATES.includes(s.state) ? s.state : "idle";
      const cap = document.getElementById("caption");
      cap.textContent = (s.state === "idle") ? "" : (s.text || s.state);
    } catch (e) { /* server not ready */ }
  }
  if (!forced) { setInterval(poll, 180); poll(); }
</script>
</body>
</html>
