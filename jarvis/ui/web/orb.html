<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarvis Orb</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .orb {
    position: relative; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fd4ff, #1e90ff 55%, #0b3d91 100%);
    box-shadow: 0 0 30px 6px rgba(30,144,255,0.55), inset 0 0 20px rgba(255,255,255,0.35);
    transition: transform .25s ease, box-shadow .3s ease, filter .3s ease;
    animation: breathe 4s ease-in-out infinite;
  }
  .ring {
    position: absolute; inset: -14px; border-radius: 50%;
    border: 2px solid rgba(120,200,255,0.5); opacity: 0;
    transition: opacity .3s ease;
  }
  /* States */
  .idle .orb      { filter: saturate(.8) brightness(.9); }
  .listening .orb { box-shadow: 0 0 40px 10px rgba(0,230,180,0.7), inset 0 0 20px rgba(255,255,255,.4);
                    background: radial-gradient(circle at 35% 30%, #a9ffe6, #00e6b4 55%, #00866a 100%); }
  .listening .ring { opacity: 1; animation: pulse 1.1s ease-out infinite; }
  .thinking .orb  { animation: spin 1.6s linear infinite, breathe 4s ease-in-out infinite;
                    background: radial-gradient(circle at 35% 30%, #d7c3ff, #8b5cf6 55%, #4c1d95 100%);
                    box-shadow: 0 0 40px 10px rgba(139,92,246,0.7), inset 0 0 20px rgba(255,255,255,.35); }
  .speaking .orb  { background: radial-gradient(circle at 35% 30%, #cfe8ff, #1e90ff 55%, #0b3d91 100%); }
  .speaking .ring { opacity: 1; animation: pulse .55s ease-out infinite; }

  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes pulse   { 0% { transform: scale(1); opacity:.8; } 100% { transform: scale(1.5); opacity:0; } }

  .caption {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    max-width: 180px; text-align: center; font-size: 11px; color: #cfe8ff;
    text-shadow: 0 1px 4px #000; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; opacity: .9;
  }
</style>
</head>
<body class="idle">
  <div class="ring"></div>
  <div class="orb"></div>
  <div class="caption" id="caption"></div>
<script>
  const STATES = ["idle", "listening", "thinking", "speaking"];
  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      const s = await r.json();
      document.body.className = STATES.includes(s.state) ? s.state : "idle";
      const cap = document.getElementById("caption");
      cap.textContent = (s.state === "idle") ? "" : (s.text || s.state);
    } catch (e) { /* server not ready */ }
  }
  setInterval(poll, 180);
  poll();
</script>
</body>
</html>
