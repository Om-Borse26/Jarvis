<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarvis HUD</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#10182c; overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  #stack { position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .toast {
    min-width:220px; max-width:320px; padding:12px 16px; border-radius:14px;
    background:rgba(16,24,44,0.78); border:1px solid rgba(120,200,255,0.25);
    color:#dce8ff; backdrop-filter:blur(16px); box-shadow:0 8px 30px rgba(0,0,0,0.45);
    animation:slidein .25s ease; }
  .toast .t { font-weight:600; font-size:13px; }
  .toast .b { font-size:12px; color:#9fb6da; margin-top:3px; }
  .toast.success { border-color:rgba(0,230,180,0.5); }
  .toast.warning { border-color:rgba(255,180,60,0.5); }

  .confirm {
    min-width:300px; max-width:360px; padding:16px 18px; border-radius:16px;
    background:rgba(20,16,40,0.9); border:1px solid rgba(139,92,246,0.55);
    color:#eae4ff; backdrop-filter:blur(18px); box-shadow:0 10px 40px rgba(0,0,0,0.55);
    animation:slidein .25s ease; }
  .confirm .q { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#b79dff; margin-bottom:8px; }
  .confirm .txt { font-size:14px; line-height:1.4; }
  .confirm .btns { display:flex; gap:10px; margin-top:14px; }
  .confirm button { flex:1; padding:9px 0; border:none; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; }
  .approve { background:#00e6b4; color:#06263a; }
  .decline { background:transparent; border:1px solid rgba(255,255,255,0.25) !important; color:#eae4ff; }

  @keyframes slidein { from { transform:translateX(20px); opacity:0; } to { transform:none; opacity:1; } }
</style>
</head>
<body>
  <div id="stack"></div>
<script>
  async function getJSON(u){ const r=await fetch(u,{cache:"no-store"}); return r.json(); }
  async function postJSON(u,b){ await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); }

  let previous = "";
  function render(data){
    const serialized = JSON.stringify(data);
    if (serialized === previous) return;
    previous = serialized;
    const stack = document.getElementById("stack");
    stack.innerHTML = "";
    if (data.confirmation) {
      const c = document.createElement("div"); c.className = "confirm";
      c.innerHTML = `<div class="q">Confirm action</div>
        <div class="txt">${data.confirmation.text}</div>
        <div class="btns">
          <button class="approve">Approve</button>
          <button class="decline">Decline</button>
        </div>`;
      c.querySelector(".approve").onclick = ()=> postJSON("/api/hud/respond",{approved:true});
      c.querySelector(".decline").onclick = ()=> postJSON("/api/hud/respond",{approved:false});
      stack.appendChild(c);
    }
    (data.notifications || []).forEach(n=>{
      const t = document.createElement("div"); t.className = "toast " + (n.level||"info");
      t.innerHTML = `<div class="t">${n.title}</div>${n.body?`<div class="b">${n.body}</div>`:""}`;
      stack.appendChild(t);
    });
  }

  async function poll(){ try{ render(await getJSON("/api/hud")); }catch(e){} }
  setInterval(poll, 500);
  poll();
</script>
</body>
</html>
