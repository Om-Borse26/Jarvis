[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S. — Local AI Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Core async & utilities ──────────────────────────────────────────
    "pydantic>=2.9.0",
    "loguru>=0.7.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "watchdog>=5.0.0",
    # ── Audio pipeline ──────────────────────────────────────────────────
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "librosa>=0.10.0",
    # ── Wake word + VAD ─────────────────────────────────────────────────
    # openwakeword installed separately (needs Python <=3.11 for tflite)
    # We use pvporcupine or a custom ONNX wake word model instead:
    "onnxruntime>=1.19.0",   # For Silero VAD + custom wake word ONNX
    # ── Speech to Text ──────────────────────────────────────────────────
    "faster-whisper>=1.1.0",
    # ── Text to Speech ──────────────────────────────────────────────────
    "kokoro-onnx>=0.4.0",
    # ── LLM client ──────────────────────────────────────────────────────
    "ollama>=0.4.0",
    # ── Memory & Vector Store ───────────────────────────────────────────
    "lancedb>=0.17.0",
    "sentence-transformers>=3.3.0",
    "networkx>=3.4.0",
    # ── Security / Vault ────────────────────────────────────────────────
    "cryptography>=43.0.0",
    "keyring>=25.0.0",
    # ── HUD & UI ────────────────────────────────────────────────────────
    "pywebview>=5.3.0",
    "websockets>=13.0",
    "websocket-client>=1.7.0",
    "pystray>=0.19.0",
    # ── Windows OS & Automation ─────────────────────────────────────────
    "pywin32>=306",
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "pynput>=1.7.0",
    "psutil>=6.0.0",
    "Pillow>=10.0.0",
    "pygetwindow>=0.0.9",
    "comtypes>=1.4.0",
    "pycaw>=20240210",
    # ── Screen capture & OCR ────────────────────────────────────────────
    "mss>=9.0.0",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
    # ── Browser automation ──────────────────────────────────────────────
    "playwright>=1.48.0",
    # ── Bluetooth & Network devices ─────────────────────────────────────
    "bleak>=0.22.0",
    "zeroconf>=0.135.0",
    # ── Communications ──────────────────────────────────────────────────
    "discord.py>=2.4.0",
    "aiosmtplib>=3.0.0",
    "aioimaplib>=1.1.0",
    # ── Scheduling & Tasks ──────────────────────────────────────────────
    "apscheduler>=3.10.0",
    "schedule>=1.2.0",
    # ── Eve sync server ─────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

# PyTorch CUDA 12.8 build — pulled from the official PyTorch index
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
