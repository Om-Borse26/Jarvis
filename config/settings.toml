# ============================================================
#  J.A.R.V.I.S. — Master Configuration
#  Edit this file to customize your Jarvis experience.
# ============================================================

[jarvis]
name          = "Jarvis"
version       = "0.1.0"
user_name     = "Sir"         # How Jarvis addresses you
personality   = "calm_professional"  # calm_professional | witty | formal | casual

[audio]
# Input device — Intel Smart Sound Technology Array (4-channel WASAPI)
input_device_index  = -1      # -1 = System default microphone
output_device_index = -1      # -1 = System default speakers
sample_rate         = 16000   # Hz — optimal for Whisper
channels            = 1       # Mono for STT
vad_threshold       = 0.5     # Silero VAD sensitivity (0.0–1.0)
ring_buffer_seconds = 30      # Circular buffer size

[wake_word]
enabled         = true        # 🔀 TOGGLE: true = "Hey Jarvis", false = hotkey only
word            = "hey_jarvis"
model_path      = "models/wake_word"
sensitivity     = 0.6         # Wake word confidence threshold (0.0–1.0)

[hotkey]
enabled         = true        # 🔀 TOGGLE: always active alongside or instead of wake word
trigger_keys    = ["win", "j"] # Win+J to trigger listening
toggle_wake_word = ["win", "shift", "j"]  # Win+Shift+J to toggle wake word on/off at runtime

[stt]
model           = "Systran/faster-distil-whisper-medium.en"
model_path      = "models/whisper"
device          = "cuda"       # cuda | cpu
compute_type    = "float16"    # float16 on CUDA, int8 on CPU
beam_size       = 1            # beam_size 1 = instant greedy decoding (< 150ms)
language        = "en"

[tts]
engine          = "kokoro"     # kokoro | piper
model_path      = "models/kokoro"
voice           = "bm_george"  # Kokoro British male voice — iconic Jarvis persona
speed           = 1.25         # 1.25 = brisk, fluent, natural British delivery
device          = "cpu"        # kokoro runs well on CPU; frees GPU for LLM

[llm]
# Provider: "ollama" (local, default) | "groq" | "gemini" | "hybrid".
# "hybrid" = local model for private turns, cloud model for non-private chat/questions.
# Can also be set at runtime via env JARVIS_LLM_PROVIDER (keys live in .env).
provider        = "ollama"
local_provider  = "ollama"   # used when provider = "hybrid"
cloud_provider  = "gemini"   # used when provider = "hybrid" (gemini | groq)
# ── Model routing (tuned for 6 GB VRAM — one model resident at a time) ──
# Only ~one model fits in 6 GB, so the everyday path stays on the small, fast
# 4B model (no reloads); heavier models load on demand for code/deep/long tasks.
fast_model      = "qwen2.5-coder:7b"           # Routing + everyday + tool calls (4.7 GB, rock-solid native tool-calling)
code_model      = "qwen2.5-coder:7b"           # Coding, scripting, MCP generation (4.7 GB)
deep_model      = "qwen3.5-32k:latest"         # Deep reasoning + screen-text analysis (3.4 GB, 32K ctx)
long_ctx_model  = "qwen2.5-coder-32k:latest"   # Very large code/doc contexts > 8K tokens (4.7 GB, 32K ctx)
# gemma4:latest (9.6 GB) is intentionally unused: it exceeds 6 GB VRAM and spills
# to CPU (slow). Set deep_model = "gemma4:latest" only if you want max quality and
# can tolerate the latency.
ollama_host     = "http://127.0.0.1:11434"
stream          = true
timeout_seconds = 30

# Task routing rules — Jarvis decides which model to use
[llm.routing]
code_keywords        = ["code", "script", "write a function", "debug", "fix this", "automate"]
deep_keywords        = ["analyze", "explain in detail", "plan", "strategy", "summarize document", "screen"]
long_context_trigger = 8000  # tokens — switch to 32K model above this

[memory]
vector_model    = "sentence-transformers/all-MiniLM-L6-v2"
vector_path     = "data/vectors"
state_db_path   = "data/jarvis.db"
log_path        = "data/logs"
max_l1_turns    = 20          # Working context window (conversation turns)
compactor_time  = "02:00"     # Run nightly memory compaction at 2:00 AM

[vault]
vault_path      = "data/vault.db"
# Master key is derived from Windows DPAPI — never stored in this file
# Vault access always requires explicit user voice confirmation

[mcp]
# MCP servers to launch automatically at startup (by name from mcp_servers.json).
# Leave empty [] to start none at boot and connect on demand via voice
# ("connect the playwright server"). Others can be marked "disabled": true there.
autostart_servers = ["playwright"]
registry_db_path    = "config/tools_registry.json"
auto_search_online  = true    # Search GitHub/MCP registry for new tools
auto_generate       = true    # Generate MCPs using qwen2.5-coder if not found
sandbox_execution   = true    # Run generated MCPs in subprocess sandbox

[ui]
enabled      = true        # Control server (island + dashboard)
http_port    = 8787        # Local dashboard at http://127.0.0.1:8787
launch_island = true       # Spawn the desktop Dynamic Island on startup
launch_hud   = true        # Spawn the HUD overlay (notifications + confirmations)

[eve]
enabled     = true        # Eve phone companion LAN sync server
port        = 8765        # Open http://<your-pc-lan-ip>:8765/eve on your phone
bind        = "0.0.0.0"   # LAN-reachable; pairing token gates all data access
sync_mode   = "lan"       # lan | tailscale
proximity_method = "arp"  # arp (LAN MAC detection) | bluetooth

[hud]
# Window behavior
always_on_top       = true
click_through_idle  = true      # Mouse clicks pass through when idle
opacity_idle        = 0.85      # Orb opacity when not active
opacity_active      = 1.0

# Position of the ambient orb (corner anchor)
orb_anchor          = "bottom_right"  # bottom_right | bottom_left | top_right
orb_size_idle       = 64        # px
orb_size_active     = 120       # px

# Colors (CSS hex)
color_primary       = "#00d4ff"  # Cyan glow
color_secondary     = "#7b61ff"  # Violet accent
color_bg            = "#0a0f1e"  # Deep navy

hud_port            = 7474       # Internal WebSocket port

[browser]
default             = "brave"
brave_path          = 'C:\Users\ombor\AppData\Local\BraveSoftware\Brave-Browser\Application\brave.exe'
chrome_path         = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
# Add more browsers here. Jarvis uses 'default' unless you say otherwise.

[mood]
enabled             = true
engine              = "librosa"   # librosa (acoustic rules) | speechbrain (neural)
update_interval_sec = 30          # Re-assess mood every 30 seconds of speech
# Mood states: focused | relaxed | stressed | tired | energized | neutral

[safety]
# Action levels:
#   L0 = read-only/ambient         → silent execution
#   L1 = non-destructive local     → subtle HUD chime
#   L2 = critical/outgoing/destruct → MANDATORY voice or HUD confirmation
critical_keywords = [
    "send", "delete", "remove", "format", "install", "uninstall",
    "post", "upload", "submit", "purchase", "pay", "transfer",
    "shutdown", "restart", "registry"
]
nothing_phone_mac   = ""      # Fill in after first pairing: e.g. "AA:BB:CC:DD:EE:FF"
greeting_on_arrival = true
